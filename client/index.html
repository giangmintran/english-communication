<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeakUp English - Học Tiếng Anh Giao Tiếp Thông Minh</title>
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('speakup-theme') || localStorage.getItem('speakup_theme') || 'light';
          const isDark = storedTheme === 'dark' || (storedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          const storedLang = localStorage.getItem('speakup-language');
          if (storedLang) {
            document.documentElement.lang = storedLang;
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0B0F19] text-slate-900 dark:text-slate-100 antialiased transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
